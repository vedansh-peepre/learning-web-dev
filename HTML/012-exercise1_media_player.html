<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>
</head>
<body>
    
    <main>
        <h1>Exotic media player</h1>
        <div id="container">
            <ol>
                <li><div class="media-container">
                    <audio src="1.mp3" height="200" width="355" controls preload="metadata"></audio>
                </div></li>

                <li><div class="media-container">
                    <audio src="2.mp3" height="200" width="355" controls preload="metadata"></audio>
                </div></li>

                <li><div class="media-container">
                    <audio src="3.mp3" height="200" width="355" controls preload="metadata"></audio>
                </div></li>

                <li><div class="media-container">
                    <audio src="4.mp3" height="200" width="355" controls preload="metadata"></audio>
                </div></li>

                <li><div class="media-container">
                    <audio src="5.mp3" height="200" width="355" controls preload="metadata"></audio>
                </div></li>

                <li><div class="media-container">
                    <audio src="6.mp3" height="200" width="355" controls preload="metadata"></audio>
                </div></li>

                <li><div class="media-container">
                    <video src="1.mp4" height="200" width="355" controls muted ></video>
                </div></li>

                <li><div class="media-container">
                    <video src="2.mp4" height="200" width="355" controls muted ></video>
                </div></li>

                <li><div class="media-container">
                    <video src="3.mp4" height="200" width="355" controls muted ></video>
                </div></li>

                <li><div class="media-container">
                        <video src="4.mp4" height="200" width="355" controls muted></video>
                </div></li>
                
                <li><div class="media-container">
                        <video src="5.mp4" height="200" width="355" controls muted></video>
                </div></li>
                
                <li><div class="media-container">
                        <video src="6.mp4" height="200" width="355" controls muted></video>
                </div></li>
            </ol>
        </div>
    </main>

</body>
</html>
