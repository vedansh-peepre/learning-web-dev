<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block elements</title>

    <style>
        p{
            background-color: tomato;
        }
        a{
            background-color: thistle;
        }
        div{
            background-color: beige;
        }
        span{
            background-color: cadetblue;
        }
    </style>
</head>
<body>
    
    <p>p is a block element</p>
    <a href="">a is an inline element</a>
    <div>div is a block element</div>
    <span>span is just like div, but an inline element</span>
    <a href="">yeah, no shit span! i'm a & i believe you</a>
    <div>
        NOTE: more block and inline elements/tags are listed in <a href="008-Comprehensive-List.txt">this list</a>
    </div>

    <h3>Quiz solution</h3>
    <form action="post">
        <caption>this is a simple form for quiz</caption>

        <div>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name">
        </div>

        <div>
            <label for="city">City:</label>
            <input type="text" name="city" id="city" placeholder="Enter your city">
        </div>

        <div>
            <label for="pin">Pincode:</label>
            <input type="number" name="pin" id="pin" Enter your pincode>
        </div>

        <div>
            <input type="submit">
        </div>

    </form>

</body>
</html>
