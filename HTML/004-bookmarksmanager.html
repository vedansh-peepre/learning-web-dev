<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Bookmarks Manager</title>
</head>
<body>
    <h1>My Bookmarks</h1>
    <h2>Primary Bookmarks</h2>
    <p>Description: Lorem ipsum dolor sit amet consectetur adipisicing elit. Doloremque, hic?</p>

    <!-- note: this is a DIRTY way to separate the anchor tags, better one is by using LISTS -->
    <p><a target="_blank" href="https://google.com">Open Google</a></p>
    <p style="background-color: lightblue;"><a target="_blank" href="https://facebook.com">Open Facebook</a></p> <!--using inline CSS-->
    <p><a target="_blank" href="https://youtube.com">Open YouTube</a></p>

    <h2>Secondary Bookmarks</h2>
    <p><a target="_blank" href="https://quora.com">Open Quora</a></p>
    <p><a target="_blank" href="https://getstoic.com">Open Stoic</a></p>

</body>
</html>
