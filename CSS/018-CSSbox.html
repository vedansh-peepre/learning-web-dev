<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS box</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box{
            background-color: yellow;
        }

        .box1{
            color: blue;
            margin: 25px;
            padding: 10px;
            border: 2px solid black;
            height: 200px;
            box-sizing: border-box;
        }

        .box2{
            color: red;
            margin: 10px;
            height: 200px;
        }

    </style>

</head>
<body>
    
    <h1>we're gonna look at css box- padding, border and margin</h1>

    <div class="box box1">I am a box</div>
    <div class="box box2">I am another box</div>

</body>
</html>
