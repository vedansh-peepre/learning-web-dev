<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and outlines in CSS</title>
    <style>
        .box{
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
            font-size: 18px;

            box-shadow: 5px 10px 5px 5px gray ; /* horizontal-offset  vertical-offset  blur  spread  color  inset */
        }

        /* inset example */
        .box1{
            box-shadow: 5px 10px 5px 5px yellowgreen inset;
        }

        .box2{
            border: 2px solid blue;
            margin: 20px;
            padding: 20px;
            border-radius: 7px;

            outline: 5px solid red;
            outline-offset: 8px;
        }
    </style>
</head>
<body>
    
    <div class="box">
        this is a box
    </div>
    
    <div class="box box1">
        this is another box
    </div>

    <div class="box2">
        Yet another box to demonstrate outline. <br>
        outline takes its borderradius prop from `border`. <br>
        its primary characteristic is that it is not a part of CSS box, hence it doesn't affect the size of element.
    </div>
</body>
</html>
