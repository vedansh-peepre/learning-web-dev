<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A simple website layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-size: 20px;
            font-family: Helvetica, sans-serif;
        }

        .nav {
            background-color: crimson;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1020;
            /* position: sticky; */
        }

        .nav ul li {
            display: inline;
            /* margin: 10px 0px; */
            padding: 20px;
            color: white;
        }

        .hero {
            display: flex;
            background-color: antiquewhite;
            margin: 30px;
            padding: 25px;
            justify-content: center;
        }

        .hero img {
            margin: 20px;
            /* position: sticky; */
        }

        .logo{
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 10;
        }

        .content {
            background-color: mediumblue;
            margin: 30px 200px;
            border-radius: 20px;
            color: white;
            font-size: 40px;
            font-weight: bolder;
            height: 400px;
            text-align: center;
            /* position: relative;
            top: 50%; */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer {
            height: 400px;
            background-color: crimson;
            font-weight: bolder;
            padding: 20px;
            color: darkred;
        }
    </style>
</head>
