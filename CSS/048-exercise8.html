<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce animation - Exercise 8</title>
    <style>

        .box{
            width: 900px;
            height: 600px;
            background-color: cadetblue;
            position: relative;
        }

        .ball{
            width: 100px;
            height: 100px;
            background-color: lime;
            position: absolute;
            bottom: 0;
            left: 0;
            border-radius: 100%;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            /* animation: animeY 1s cubic-bezier(0.25, 0.1, 0.32, 1) 0s infinite alternate, 
                       animeX 3s linear 0s 1 forwards; */
            animation: animeY 1s cubic-bezier(0.14, 0.45, 0.45, 0.96) 0s infinite alternate,
                       animeX 5s linear 0s infinite forwards;
        }

        @keyframes animeY {
            from{}
            to{
                bottom: 400px;
            }
        }

        @keyframes animeX {
            from{}
            to{
                left: 85%;
            }
        }

    </style>
</head>
<body>
    
    <div class="box">
        <div class="ball"></div>
    </div>

</body>
</html>
