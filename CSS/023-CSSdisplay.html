<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display properties in CSS</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .box{
            border: 2px solid blue;
            box-sizing: border-box;
            display: inline; /*the margin, padding and width properties doesn't work well with inline display elements*/
            

            margin: 45px;
            padding: 20px;
        }

        .box1{
            display: inline-block;
            /* i noticed that even the other box got right */
            /* the margins don't overlap, but they add now */

            /* display:none;  */
            /* obj disappears and space too */

            /* visibility: hidden; */
            /* obj disappears, but space still taken */
        }
    </style>

</head>
<body>
    
    <div class="box box1">this is a box</div>

    <div class="box">this is another box</div>

    <span>i am a good|</span>
    <span>|boy</span>

</body>
</html>
